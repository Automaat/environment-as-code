name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.4

      - name: shellcheck
        run: shellcheck bootstrap.sh dotfiles/claude/statusline-command.sh dotfiles/bin/*

      - name: actionlint
        run: actionlint

      - name: agent permission profiles are valid
        run: |
          jq -e '.policy_revision and (.profiles | keys == ["build", "explore", "release", "review"]) and all(.rules[]; .id and .decision and .reason)' dotfiles/agents/permission-profiles.json
          jq -e '.permission["*"] == "ask" and .agent.explore.permission.edit == "deny" and .agent.review.permission["datadog-mcp_*"] == "ask" and .agent.build.permission["chrome-devtools_*"] == "ask"' dotfiles/opencode/opencode.json.tmpl
          for profile in explore review build release; do
            grep -q "^name: $profile$" "dotfiles/claude/agents/$profile.md"
            grep -q '^permissionMode:' "dotfiles/claude/agents/$profile.md"
          done

      # Machines set up before zakwas linked the instructions have links into
      # the old dotfiles/claude sources; the links module must move the
      # Copilot CLI and ~/AGENTS.md ones to AGENTS.md.
      - name: links converge from the old link.sh layout
        env:
          HOME: ${{ runner.temp }}/h
        run: |
          old="$PWD/dotfiles/claude"
          mkdir -p "$HOME/.claude" "$HOME/.copilot/instructions"
          ln -s "$old/AGENTS.md" "$HOME/.copilot/instructions/global.instructions.md"
          ln -s "$old/AGENTS.md" "$HOME/AGENTS.md"
          ln -s /nonexistent/statusline-command.sh "$HOME/.claude/statusline-command.sh"
          zakwas apply -y --only links
          for p in .copilot/instructions/global.instructions.md AGENTS.md; do
            if [ "$(readlink "$HOME/$p")" != "$PWD/dotfiles/agents/AGENTS.md" ]; then echo "$HOME/$p not linked to AGENTS.md"; exit 1; fi
          done
          if [ "$(readlink "$HOME/.claude/statusline-command.sh")" != "$old/statusline-command.sh" ]; then echo "status line not linked"; exit 1; fi
          zakwas check --only links

      # The full agents module installs plugins and needs the agent CLIs, so
      # this applies only agents.instructions, with the real providers and
      # path, from a minimal config.
      - name: agent instructions converge from the old link.sh layout
        env:
          HOME: ${{ runner.temp }}/i
        run: |
          providers=$(sed -n '/^agents:/,/^[a-z]/s/^  providers: //p' zakwas.yaml)
          instructions=$(sed -n '/^agents:/,/^[a-z]/s/^  instructions: //p' zakwas.yaml)
          cfg="$RUNNER_TEMP/instructions.yaml"
          printf 'agents:\n  providers: %s\n  instructions: %s\n' "$providers" "$PWD/$instructions" > "$cfg"
          old="$PWD/dotfiles/claude"
          mkdir -p "$HOME/.claude" "$HOME/.codex" "$HOME/.config/opencode"
          ln -s "$old/CLAUDE.md" "$HOME/.claude/CLAUDE.md"
          ln -s "$old/AGENTS.md" "$HOME/.codex/AGENTS.md"
          ln -s "$old/AGENTS.md" "$HOME/.config/opencode/AGENTS.md"
          zakwas apply -y -c "$cfg" --only agents
          for p in .claude/CLAUDE.md .codex/AGENTS.md .config/opencode/AGENTS.md; do
            if [ "$(readlink "$HOME/$p")" != "$PWD/dotfiles/agents/AGENTS.md" ]; then echo "$HOME/$p not linked to AGENTS.md"; exit 1; fi
          done
          zakwas check -c "$cfg" --only agents

      - name: config resolves on a real Mac
        run: zakwas plan --only system,files,links,templates,commands,defaults

      # The brew module parses undocumented `brew bundle` output. The runner
      # ships formulae the Brewfile doesn't list, so a working cleanup parser
      # must report some; an empty list means the format changed.
      - name: brew output parsers work against real Homebrew
        run: |
          zakwas plan --only brew | tee "$RUNNER_TEMP/brew.plan"
          grep -qE '^  - (brew|cask) ' "$RUNNER_TEMP/brew.plan"

  e2e:
    name: e2e on a fresh Mac
    # Converges a clean macOS runner with the real config, the closest thing
    # to a new machine. Casks are skipped: several need GUI approval (kexts,
    # pkg installers) that a runner can't give. Also gates Renovate bumps of
    # the pinned tools.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      # The managed git config rewrites GitHub HTTPS to SSH; the runner has no
      # key on GitHub (bootstrap.sh registers one before installing tools).
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.4

      # Restore and save are split so tools downloaded by a run that later
      # fails are still kept; the combined action only saves on success.
      - name: restore pinned tools
        id: tools
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs
          key: mise-tools-${{ runner.os }}-${{ hashFiles('dotfiles/mise/config.toml') }}
          restore-keys: mise-tools-${{ runner.os }}-

      # kong/* is a private tap the runner can't clone. The image pins
      # HOMEBREW_NO_AUTO_UPDATE and ships a stale formula index (e.g. a mise
      # too old for the pypi backend), so update first, as a fresh Mac would.
      # bundle install trusts the taps from their `trusted: true` options.
      - name: install formulae from the Brewfile
        run: |
          brew update --quiet
          grep -E '^(tap|brew) ' Brewfile | grep -v '"kong/' > "$RUNNER_TEMP/Brewfile"
          brew bundle install --file "$RUNNER_TEMP/Brewfile" --no-upgrade

      # apply is idempotent, so one rerun absorbs runner network flakes.
      - name: apply
        run: |
          modules=system,files,templates,mise,defaults
          zakwas apply -y --only "$modules" || zakwas apply -y --only "$modules"

      - name: save pinned tools
        if: always() && steps.tools.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/mise/installs
          key: mise-tools-${{ runner.os }}-${{ hashFiles('dotfiles/mise/config.toml') }}

      # The applied global mise config pins zakwas too.
      - name: nothing left to change, checked via the globally pinned zakwas
        working-directory: /
        env:
          ZAKWAS_CONFIG: ${{ github.workspace }}/zakwas.yaml
        run: mise exec -- zakwas check --only system,files,templates,mise,defaults

      - name: Claude Code CLI runs from the global mise config
        working-directory: /
        run: mise exec -- claude --version

      - name: agent profile configs load in provider CLIs
        run: |
          claude_home="$RUNNER_TEMP/claude-profiles"
          mkdir -p "$claude_home/.claude/agents/permission-profiles"
          cp dotfiles/claude/agents/*.md "$claude_home/.claude/agents/permission-profiles/"
          for profile in explore review build release; do
            if env -u ANTHROPIC_API_KEY HOME="$claude_home" mise exec -- \
              claude --agent "$profile" -p validate > "$RUNNER_TEMP/claude-$profile.out" 2>&1; then
              echo "Claude unexpectedly authenticated in the isolated profile test"
              exit 1
            fi
            if ! grep -q 'Not logged in' "$RUNNER_TEMP/claude-$profile.out"; then
              cat "$RUNNER_TEMP/claude-$profile.out"
              exit 1
            fi
          done
          for profile in explore review build release; do
            home="$RUNNER_TEMP/codex-$profile"
            mkdir -p "$home"
            cp "dotfiles/codex/$profile.config.toml" "$home/$profile.config.toml"
            if CODEX_HOME="$home" mise exec -- codex --strict-config --profile "$profile" \
              -c model_provider='"missing-for-config-validation"' exec --skip-git-repo-check validate \
              > "$RUNNER_TEMP/codex-$profile.out" 2>&1; then
              echo "Codex unexpectedly ran with a missing model provider"
              exit 1
            fi
            if ! grep -q "Model provider.*missing-for-config-validation.*not found" \
              "$RUNNER_TEMP/codex-$profile.out"; then
              cat "$RUNNER_TEMP/codex-$profile.out"
              exit 1
            fi
          done
          jq '{"$schema": "https://opencode.ai/config.json", permission, agent}' \
            dotfiles/opencode/opencode.json.tmpl > "$RUNNER_TEMP/opencode-agent-profiles.json"
          mise exec -- uvx --from check-jsonschema==0.38.2 check-jsonschema \
            --schemafile https://opencode.ai/config.json \
            "$RUNNER_TEMP/opencode-agent-profiles.json"

      - name: dotfiles are protected
        run: |
          if echo x >> "$HOME/.zshrc"; then echo "$HOME/.zshrc is writable"; exit 1; fi
          stat -f %Sf "$HOME/.zshrc" | grep -q uchg

      # The first shell clones antidote plugins; the second must print nothing.
      # script(1) gives zsh a terminal as a real session has; zsh's own output
      # goes to a file so script's pty echo doesn't count as output.
      - name: login shell starts cleanly with the pinned tools
        env:
          TERM: xterm-256color
        run: |
          zsh -il -c true > /dev/null 2>&1 || true
          cat > "$RUNNER_TEMP/smoke.sh" <<'EOF'
          zsh -il -c 'for t in kubectl gh jq starship k9s helm fzf direnv; do command -v $t > /dev/null || echo "missing $t"; done' > "$RUNNER_TEMP/zsh.out" 2>&1
          EOF
          script -q /dev/null sh "$RUNNER_TEMP/smoke.sh" > /dev/null
          if [ -s "$RUNNER_TEMP/zsh.out" ]; then cat "$RUNNER_TEMP/zsh.out"; exit 1; fi
