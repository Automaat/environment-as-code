[tools]
"github:Automaat/zakwas" = "0.17.1"
"npm:@openai/codex" = "0.167.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"
jq = "1.8.2"
uv = "0.13.7"

[tasks.lint]
run = "shellcheck bootstrap.sh dotfiles/claude/statusline-command.sh dotfiles/bin/* layers/studio/bin/* evals/agent-workflows/validate.sh && actionlint && evals/agent-workflows/validate.sh"

[tasks.test]
run = "python3 -m unittest discover -s tests -v"

[tasks.plan]
run = "zakwas plan"

[tasks.apply]
run = "zakwas apply"
