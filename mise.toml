[tools]
"github:Automaat/zakwas" = "0.7.1"
"npm:@openai/codex" = "0.160.1"
shellcheck = "0.11.0"
actionlint = "1.7.12"

[tasks.lint]
run = "shellcheck bootstrap.sh dotfiles/claude/statusline-command.sh dotfiles/bin/* && actionlint"

[tasks.plan]
run = "zakwas plan"

[tasks.apply]
run = "zakwas apply"
