      - du
      - df
      - stat
      - file
      - readlink
      - realpath
      - dirname
      - basename
      - cut
      - sort
      - uniq
      - tr
      - comm
      - column
      - nl
      - od
      - xxd
      - diff
      - cmp
      - jq
      - yq
      - date
      - pwd
      - which
      - type
      - uname
      - sw_vers
      - vm_stat
      - shasum
      - md5
      - base64
      - plutil -p
      - python3 -m json.tool
      - python3 -m py_compile
      - ps
      - pgrep
