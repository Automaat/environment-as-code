# yaml-language-server: $schema=https://raw.githubusercontent.com/Automaat/zakwas/main/schema/zakwas.schema.json
protect:
  immutable: true

files:
  - {src: dotfiles/zsh/zshrc, dst: ~/.zshrc}
  - {src: dotfiles/zsh/zshenv, dst: ~/.zshenv}
  - {src: dotfiles/zsh/zprofile, dst: ~/.zprofile}
  - {src: dotfiles/zsh/zsh_plugins.txt, dst: ~/.config/zsh/zsh_plugins.txt}
  - {src: dotfiles/git/config, dst: ~/.config/git/config}
  - {src: dotfiles/git/.gitignore_global, dst: ~/.gitignore_global}
  - {src: dotfiles/vim/vimrc, dst: ~/.vimrc}
  - {src: dotfiles/gnupg/gpg.conf, dst: ~/.gnupg/gpg.conf}
  - {src: dotfiles/gnupg/gpg-agent.conf, dst: ~/.gnupg/gpg-agent.conf}
  - {src: dotfiles/mise/config.toml, dst: ~/.config/mise/config.toml}
  - {src: dotfiles/agents/permission-profiles.json, dst: ~/.config/agents/permission-profiles.json}
  - {src: dotfiles/tmux/tmux.conf, dst: ~/.config/tmux/tmux.conf}
  - {src: dotfiles/launchd/dev.zsh-clean-history.plist, dst: ~/Library/LaunchAgents/dev.zsh-clean-history.plist}
  - {src: dotfiles/claude/agents, dst: ~/.claude/agents/permission-profiles}
  - {src: dotfiles/codex/explore.config.toml, dst: ~/.codex/explore.config.toml}
  - {src: dotfiles/codex/review.config.toml, dst: ~/.codex/review.config.toml}
  - {src: dotfiles/codex/build.config.toml, dst: ~/.codex/build.config.toml}
  - {src: dotfiles/codex/release.config.toml, dst: ~/.codex/release.config.toml}
  - {src: dotfiles/starship/starship.toml, dst: ~/.config/starship.toml}
  - {src: dotfiles/bilgie/config.yaml, dst: ~/.config/bilgie/config.yaml}
  - {src: dotfiles/ghostty/config, dst: ~/.config/ghostty/config}
  - {src: dotfiles/ghostty/themes, dst: ~/.config/ghostty/themes}
  # Calibrite display profiles; after recalibrating, copy the new .icc here
  # and drop the old one (once no display uses it). Installed copies are
  # locked, so save a recalibration under a new name, not over an old one.
  - {src: dotfiles/colorsync, dst: ~/Library/ColorSync/Profiles}
  - {src: dotfiles/k9s/skins/transparent.yaml, dst: ~/.config/k9s/skins/transparent.yaml}
  - {src: dotfiles/k9s/skins/everforest-light.yaml, dst: ~/.config/k9s/skins/everforest-light.yaml}
  - {src: dotfiles/k9s/skins/nord-light.yaml, dst: ~/.config/k9s/skins/nord-light.yaml}
  - {src: dotfiles/hammerspoon/init.lua, dst: ~/.hammerspoon/init.lua}
  - {src: dotfiles/hammerspoon/zoom-smart-plug.lua, dst: ~/.hammerspoon/zoom-smart-plug.lua}
  - {src: dotfiles/hammerspoon/desk-charger-battery.lua, dst: ~/.hammerspoon/desk-charger-battery.lua}
  - {src: dotfiles/bin/gh-add-subissue, dst: ~/.local/bin/gh-add-subissue}
  - {src: dotfiles/bin/zakwas-check-notify, dst: ~/.local/bin/zakwas-check-notify}
  - {src: dotfiles/bin/build-slot, dst: ~/.local/bin/build-slot}
  - {src: dotfiles/bin/zsh-refresh-completions, dst: ~/.local/bin/zsh-refresh-completions}
  - {src: dotfiles/streamdeck/profiles.streamDeckProfilesBackup, dst: ~/.local/share/streamdeck/profiles.streamDeckProfilesBackup}
  - {src: dotfiles/swift/display-profiles, dst: ~/.local/bin/display-profiles}

# The work Mac's device management forces ~/.ssh/config back to 600 every
# ~15 minutes, which would undo the files protection.
links:
  - {src: dotfiles/ssh/config, dst: ~/.ssh/config}
  - {src: dotfiles/claude/statusline-command.sh, dst: ~/.claude/statusline-command.sh}
  # Global agent instructions for the tools agents.instructions doesn't cover.
  - {src: dotfiles/agents/AGENTS.md, dst: ~/.copilot/instructions/global.instructions.md}
  - {src: dotfiles/agents/AGENTS.md, dst: ~/AGENTS.md}
  # Calibrite PROFILER saved presets; the app rewrites this file when saving
  # one. The path carries the app version, so update it after an upgrade.
  - {src: dotfiles/calibrite/userPresets.json, dst: "~/Library/Application Support/calibrite PROFILER/3.1.3/presets/userPresets.json"}

templates:
  files:
    - {src: dotfiles/k9s/config.yaml.tmpl, dst: ~/.config/k9s/config.yaml}
    - {src: dotfiles/klaudiush/config.toml.tmpl, dst: ~/.config/klaudiush/config.toml}
    - {src: dotfiles/launchd/dev.zakwas.check.plist.tmpl, dst: ~/Library/LaunchAgents/dev.zakwas.check.plist}
    - {src: dotfiles/launchd/dev.reef.observe.plist.tmpl, dst: ~/Library/LaunchAgents/dev.reef.observe.plist}
    - {src: dotfiles/launchd/dev.reef.serve.plist.tmpl, dst: ~/Library/LaunchAgents/dev.reef.serve.plist}

brew:
  file: Brewfile
  cleanup: zap
  upgrade: true

mise:
  config: dotfiles/mise/config.toml
  prune: true

# Agent plugins for Claude Code, Codex and opencode. Entries without their own
# providers target all three. Codex and opencode are named so zakwas manages
# them strictly instead of skipping them. Every skill installs for all three;
# only marketplaces whose plugins aren't skills (LSP, MCP) are narrowed.
# opencode can't keep an on-request skill from running on its own, so there
# those skills rely on their own wording.
# instructions is linked as each provider's global CLAUDE.md / AGENTS.md.
agents:
  providers: [claude, codex, opencode]
  codex:
    settings:
      agents:
        enabled: true
        max_concurrent_threads_per_session: 8
  instructions: dotfiles/agents/AGENTS.md
  hooks:
    klaudiush: true
  permissions:
    allow:
      - git status
      - git diff
      - git log
      - git show
      - git rev-parse
      - git merge-base
      - git ls-files
      - git ls-tree
