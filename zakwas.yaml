      - git cat-file
      - git rev-list
      - git name-rev
      - git show-ref
      - git for-each-ref
      - git blame
      - git grep
      - git check-ignore
      - git verify-commit
      - git verify-tag
      - git config --get
      - git fetch
      - git --no-pager diff
      - git --no-pager log
      - git --no-pager show
      - git switch
      - git merge
      - git add
      - git commit
      - git push
      - git stash
      - git rebase
      - git cherry-pick
      - git tag
      - git restore
      - git checkout
      - git branch
      - git remote
