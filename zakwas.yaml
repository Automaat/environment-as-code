# yaml-language-server: $schema=https://raw.githubusercontent.com/Automaat/zakwas/main/schema/zakwas.schema.json
protect:
  immutable: true

files:
  - {src: dotfiles/zsh/zshrc, dst: ~/.zshrc}
  - {src: dotfiles/zsh/zshenv, dst: ~/.zshenv}
  - {src: dotfiles/zsh/zprofile, dst: ~/.zprofile}
  - {src: dotfiles/zsh/zsh_plugins.txt, dst: ~/.config/zsh/zsh_plugins.txt}
  - {src: dotfiles/git/config, dst: ~/.config/git/config}
  - {src: dotfiles/git/.gitignore_global, dst: ~/.gitignore_global}
  - {src: dotfiles/vim/vimrc, dst: ~/.vimrc}
  - {src: dotfiles/gnupg/gpg.conf, dst: ~/.gnupg/gpg.conf}
  - {src: dotfiles/gnupg/gpg-agent.conf, dst: ~/.gnupg/gpg-agent.conf}
  - {src: dotfiles/mise/config.toml, dst: ~/.config/mise/config.toml}
  - {src: dotfiles/opencode/cli.json, dst: ~/.config/opencode/cli.json}
  - {src: dotfiles/opencode/themes/kong-dark.json, dst: ~/.config/opencode/themes/kong-dark.json}
  - {src: dotfiles/opencode/themes/kong-light.json, dst: ~/.config/opencode/themes/kong-light.json}
  - {src: dotfiles/agents/permission-profiles.json, dst: ~/.config/agents/permission-profiles.json}
  - {src: dotfiles/tmux/tmux.conf, dst: ~/.config/tmux/tmux.conf}
  - {src: dotfiles/launchd/dev.zsh-clean-history.plist, dst: ~/Library/LaunchAgents/dev.zsh-clean-history.plist}
  - {src: dotfiles/claude/agents, dst: ~/.claude/agents/permission-profiles}
  - {src: dotfiles/codex/explore.config.toml, dst: ~/.codex/explore.config.toml}
  - {src: dotfiles/codex/review.config.toml, dst: ~/.codex/review.config.toml}
  - {src: dotfiles/codex/build.config.toml, dst: ~/.codex/build.config.toml}
  - {src: dotfiles/codex/release.config.toml, dst: ~/.codex/release.config.toml}
  - {src: dotfiles/starship/starship.toml, dst: ~/.config/starship.toml}
  - {src: dotfiles/ghostty/config, dst: ~/.config/ghostty/config}
  - {src: dotfiles/ghostty/themes, dst: ~/.config/ghostty/themes}
  # Calibrite display profiles; after recalibrating, copy the new .icc here
  # and drop the old one (once no display uses it). Installed copies are
  # locked, so save a recalibration under a new name, not over an old one.
  - {src: dotfiles/colorsync, dst: ~/Library/ColorSync/Profiles}
  - {src: dotfiles/k9s/skins/transparent.yaml, dst: ~/.config/k9s/skins/transparent.yaml}
  - {src: dotfiles/k9s/skins/everforest-light.yaml, dst: ~/.config/k9s/skins/everforest-light.yaml}
  - {src: dotfiles/k9s/skins/nord-light.yaml, dst: ~/.config/k9s/skins/nord-light.yaml}
  - {src: dotfiles/hammerspoon/init.lua, dst: ~/.hammerspoon/init.lua}
  - {src: dotfiles/hammerspoon/zoom-smart-plug.lua, dst: ~/.hammerspoon/zoom-smart-plug.lua}
  - {src: dotfiles/hammerspoon/desk-charger-battery.lua, dst: ~/.hammerspoon/desk-charger-battery.lua}
  - {src: dotfiles/bin/gh-add-subissue, dst: ~/.local/bin/gh-add-subissue}
  - {src: dotfiles/bin/zakwas-check-notify, dst: ~/.local/bin/zakwas-check-notify}
  - {src: dotfiles/bin/build-slot, dst: ~/.local/bin/build-slot}
  - {src: dotfiles/bin/zsh-refresh-completions, dst: ~/.local/bin/zsh-refresh-completions}

# The work Mac's device management forces ~/.ssh/config back to 600 every
# ~15 minutes, which would undo the files protection.
links:
  - {src: dotfiles/ssh/config, dst: ~/.ssh/config}
  - {src: dotfiles/claude/statusline-command.sh, dst: ~/.claude/statusline-command.sh}
  # Global agent instructions for the tools agents.instructions doesn't cover.
  - {src: dotfiles/agents/AGENTS.md, dst: ~/.copilot/instructions/global.instructions.md}
  - {src: dotfiles/agents/AGENTS.md, dst: ~/AGENTS.md}

templates:
  files:
    - {src: dotfiles/k9s/config.yaml.tmpl, dst: ~/.config/k9s/config.yaml}
    - {src: dotfiles/klaudiush/config.toml.tmpl, dst: ~/.config/klaudiush/config.toml}
    - {src: dotfiles/launchd/dev.zakwas.check.plist.tmpl, dst: ~/Library/LaunchAgents/dev.zakwas.check.plist}
    - {src: dotfiles/launchd/dev.reef.observe.plist.tmpl, dst: ~/Library/LaunchAgents/dev.reef.observe.plist}
    - {src: dotfiles/launchd/dev.reef.serve.plist.tmpl, dst: ~/Library/LaunchAgents/dev.reef.serve.plist}
    - {src: dotfiles/opencode/opencode.json.tmpl, dst: ~/.config/opencode/opencode.json}
    - {src: dotfiles/opencode/tui.json.tmpl, dst: ~/.config/opencode/tui.json}

brew:
  file: Brewfile
  cleanup: zap
  upgrade: true

mise:
  config: dotfiles/mise/config.toml
  prune: true

# Agent plugins for Claude Code, Codex and opencode. Entries without their own
# providers target all three. Codex and opencode are named so zakwas manages
# them strictly instead of skipping them. Every skill installs for all three;
# only marketplaces whose plugins aren't skills (LSP, MCP) are narrowed.
# opencode can't keep an on-request skill from running on its own, so there
# those skills rely on their own wording.
# instructions is linked as each provider's global CLAUDE.md / AGENTS.md.
agents:
  providers: [claude, codex, opencode]
  instructions: dotfiles/agents/AGENTS.md
  hooks:
    klaudiush: true
  upgrade: true
  prune: true
  marketplaces:
    sai: smykla-skalski/sai
    environment-as-code: ./
    claude-plugins-official: {source: anthropics/claude-plugins-official, providers: [claude]}
    ksai: Kong/ksai
    slack: {source: slackapi/slack-skills-plugin, providers: [codex, opencode]}
  plugins:
    - adversarial-review@sai
    - adversarial-test@sai
    - ai-daily-digest@sai
    - humanize@sai
    - kubecon-cfp@sai
    - plan-critic@sai
    - promptgen@sai
    - refactor-council@sai
    - review-claude-md@sai
    - ship-it@sai
    - staff-resume@sai
    - technical-debt-manager@sai
    - test-writer@sai
    - youtube-summary@sai
    - agent-workflow@environment-as-code
    - agent-md-gen@environment-as-code
    - go-code-review@environment-as-code
    - kong-ai-intel@environment-as-code
    - fix-review@environment-as-code
    - peekaboo@environment-as-code
    - gopls-lsp@claude-plugins-official
    - slack@claude-plugins-official
    - issue-authoring@ksai
    - slack@slack

system:
  sudoTouchID: true
  dirs:
    - {path: ~/.ssh, mode: 0o700}
    - {path: ~/.gnupg, mode: 0o700}
    - {path: ~/Documents/1_Projects}
    - {path: ~/Documents/2_Areas}
    - {path: ~/Documents/3_Resources}
    - {path: ~/Documents/4_Archive}
    - {path: ~/Documents/screenshots}
  sshKey:
    path: ~/.ssh/id_ed25519
    comment: skalskimarcin33@gmail.com

commands:
  - name: pinned codex chrome devtools server
    check: >-
      codex mcp get chrome-devtools 2> /dev/null |
      grep -Fqx "  command: $HOME/.local/share/mise/shims/chrome-devtools-mcp"
    run: >-
      codex mcp remove chrome-devtools &&
      codex mcp add chrome-devtools -- "$HOME/.local/share/mise/shims/chrome-devtools-mcp"
  - name: pinned Peekaboo MCP for Codex and Claude Code
    check: >-
      codex mcp get peekaboo 2> /dev/null |
      grep -Fqx "  command: /opt/homebrew/bin/mise" &&
      codex mcp get peekaboo 2> /dev/null |
      grep -Fqx "  args: exec npm:@steipete/peekaboo@4.9.0 -- peekaboo mcp" &&
      jq -e '.mcpServers.peekaboo.command == "/opt/homebrew/bin/mise" and
      .mcpServers.peekaboo.args == ["exec", "npm:@steipete/peekaboo@4.9.0", "--", "peekaboo", "mcp"]'
      "$HOME/.claude.json" > /dev/null 2>&1
    run: >-
      if codex mcp get peekaboo > /dev/null 2>&1; then codex mcp remove peekaboo; fi &&
      codex mcp add peekaboo -- /opt/homebrew/bin/mise exec npm:@steipete/peekaboo@4.9.0 -- peekaboo mcp &&
      { claude mcp remove peekaboo -s user > /dev/null 2>&1 || true; } &&
      claude mcp add -s user peekaboo -- /opt/homebrew/bin/mise exec npm:@steipete/peekaboo@4.9.0 -- peekaboo mcp
  - name: gke-gcloud-auth-plugin
    check: test -x /opt/homebrew/share/google-cloud-sdk/bin/gke-gcloud-auth-plugin
    run: gcloud components install gke-gcloud-auth-plugin --quiet
  - name: zsh completions current
    check: zsh-refresh-completions --check
    run: zsh-refresh-completions
  - name: daily zsh history cleanup
    check: >-
      launchctl print "gui/$(id -u)/dev.zsh-clean-history" > /dev/null 2>&1 &&
      cmp -s "$HOME/Library/LaunchAgents/dev.zsh-clean-history.plist" "$HOME/.local/state/zakwas/dev.zsh-clean-history.loaded.plist"
    run: >-
      launchctl bootout "gui/$(id -u)/dev.zsh-clean-history" 2> /dev/null;
      launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/dev.zsh-clean-history.plist" &&
      mkdir -p "$HOME/.local/state/zakwas" &&
      cp -f "$HOME/Library/LaunchAgents/dev.zsh-clean-history.plist" "$HOME/.local/state/zakwas/dev.zsh-clean-history.loaded.plist"
  - name: daily drift notification
    check: >-
      launchctl print "gui/$(id -u)/dev.zakwas.check" > /dev/null 2>&1 &&
      cmp -s "$HOME/Library/LaunchAgents/dev.zakwas.check.plist" "$HOME/.local/state/zakwas/dev.zakwas.check.loaded.plist"
    run: >-
      launchctl bootout "gui/$(id -u)/dev.zakwas.check" 2> /dev/null;
      launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/dev.zakwas.check.plist" &&
      mkdir -p "$HOME/.local/state/zakwas" &&
      cp -f "$HOME/Library/LaunchAgents/dev.zakwas.check.plist" "$HOME/.local/state/zakwas/dev.zakwas.check.loaded.plist"
  - name: reef baseline recorder
    check: >-
      launchctl print "gui/$(id -u)/dev.reef.observe" 2> /dev/null |
      grep -Fq "state = running" &&
      cmp -s "$HOME/Library/LaunchAgents/dev.reef.observe.plist" "$HOME/.local/state/zakwas/dev.reef.observe.loaded.plist"
    run: >-
      launchctl bootout "gui/$(id -u)/dev.reef.observe" 2> /dev/null;
      launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/dev.reef.observe.plist" &&
      mkdir -p "$HOME/.local/state/zakwas" &&
      cp -f "$HOME/Library/LaunchAgents/dev.reef.observe.plist" "$HOME/.local/state/zakwas/dev.reef.observe.loaded.plist"
  - name: reef background scheduler
    check: >-
      launchctl print "gui/$(id -u)/dev.reef.serve" 2> /dev/null |
      grep -Fq "state = running" &&
      cmp -s "$HOME/Library/LaunchAgents/dev.reef.serve.plist" "$HOME/.local/state/zakwas/dev.reef.serve.loaded.plist"
    run: >-
      launchctl bootout "gui/$(id -u)/dev.reef.serve" 2> /dev/null;
      launchctl bootstrap "gui/$(id -u)" "$HOME/Library/LaunchAgents/dev.reef.serve.plist" &&
      mkdir -p "$HOME/.local/state/zakwas" &&
      cp -f "$HOME/Library/LaunchAgents/dev.reef.serve.plist" "$HOME/.local/state/zakwas/dev.reef.serve.loaded.plist"
  - name: reef agent observation setup
    check: reef agents setup --check
    run: reef agents setup
  # Pre-rename agent: removing its plist doesn't unload it.
  - name: old eac drift agent unloaded
    check: '! launchctl print "gui/$(id -u)/dev.eac.check" > /dev/null 2>&1'
    run: launchctl bootout "gui/$(id -u)/dev.eac.check"
  # technical-debt-manager and youtube-summary used to be linked from
  # research-machine; they're SAI plugins now, so the old links would load twice.
  - name: old research-machine skill links removed
    check: >-
      for l in .claude/skills/technical-debt-manager .claude/skills/youtube-summary .codex/skills/technical-debt-manager;
      do case "$(readlink "$HOME/$l")" in */research-machine/*) exit 1 ;; esac; done
    run: >-
      for l in .claude/skills/technical-debt-manager .claude/skills/youtube-summary .codex/skills/technical-debt-manager;
      do case "$(readlink "$HOME/$l")" in */research-machine/*) rm -f "$HOME/$l" ;; esac; done
  # The old link script linked the instruction rules dir here; its source is
  # gone now that the rules live in dotfiles/agents/AGENTS.md.
  - name: old claude rules link removed
    check: >-
      case "$(readlink "$HOME/.claude/rules")" in */environment-as-code/dotfiles/claude/rules) exit 1 ;; esac
    run: rm -f "$HOME/.claude/rules"
  # General skills that live outside any marketplace. openscad is a third-party
  # repo; it is linked into ~/.agents/skills (Codex, opencode) and
  # ~/.claude/skills (Claude) so updates via git pull reach every agent.
  - name: openscad skill shared with all agents
    check: >-
      d="$HOME/Development/Claude/openscad_claude_skill";
      test -f "$d/SKILL.md" &&
      test "$(readlink "$HOME/.agents/skills/openscad")" = "$d" &&
      test "$(readlink "$HOME/.claude/skills/openscad")" = "$d"
    run: >-
      d="$HOME/Development/Claude/openscad_claude_skill";
      { test -d "$d" || git clone https://github.com/andreahaku/openscad_claude_skill.git "$d"; } &&
      mkdir -p "$HOME/.agents/skills" "$HOME/.claude/skills" &&
      ln -sfn "$d" "$HOME/.agents/skills/openscad" &&
      ln -sfn "$d" "$HOME/.claude/skills/openscad"
  # Orca and the skills CLI install general skills into ~/.agents/skills, which
  # Codex and opencode read but Claude doesn't. Link each into ~/.claude/skills
  # so Claude gets them too; the owners keep updating them in place.
  - name: shared agent skills linked for claude
    check: >-
      for s in computer-use find-skills orca-cli orchestration;
      do test -f "$HOME/.agents/skills/$s/SKILL.md" || continue;
      test "$(readlink "$HOME/.claude/skills/$s")" = "$HOME/.agents/skills/$s" || exit 1; done
    run: >-
      mkdir -p "$HOME/.claude/skills" &&
      for s in computer-use find-skills orca-cli orchestration;
      do test -f "$HOME/.agents/skills/$s/SKILL.md" || continue;
      ln -sfn "$HOME/.agents/skills/$s" "$HOME/.claude/skills/$s"; done
  # claude mcp add writes ~/.claude.json, which zakwas doesn't manage. The
  # pinned mise binary replaces npx @latest, which left a wrapper per session.
  - name: claude chrome-devtools mcp pinned
    check: >-
      jq -e '.mcpServers["chrome-devtools"].command | endswith("/chrome-devtools-mcp")'
      "$HOME/.claude.json" > /dev/null 2>&1
    run: >-
      claude mcp remove chrome-devtools -s user > /dev/null 2>&1;
      claude mcp add -s user chrome-devtools -- "$HOME/.local/share/mise/shims/chrome-devtools-mcp"
  # Install Sail's project memory tools in the global Claude Code and Codex configs.
  # OpenCode reads the same launcher from its managed template above.
  - name: Sail shared memory MCP for Claude Code and Codex
    check: >-
      if test -x "$HOME/sideprojects/sai-harness/src-tauri/target/debug/sail"; then
        claude mcp get sail-shared-memory > /dev/null 2>&1 &&
        codex mcp get sail-shared-memory > /dev/null 2>&1;
      else true; fi
    run: >-
      if test -x "$HOME/sideprojects/sai-harness/src-tauri/target/debug/sail"; then
        (claude mcp get sail-shared-memory -s user > /dev/null 2>&1 ||
          claude mcp add -s user sail-shared-memory
            -e SAIL_MEMORY_AGENT=claude
            -e "SAIL_MEMORY_ROOT=$HOME/Library/Application Support/dev.smykla.sai-harness/memory"
            -e "SAIL_SETTINGS_PATH=$HOME/Library/Application Support/sail/settings.json"
            -- "$HOME/sideprojects/sai-harness/src-tauri/target/debug/sail" --memory-mcp) &&
        (codex mcp get sail-shared-memory > /dev/null 2>&1 ||
          codex mcp add
            --env SAIL_MEMORY_AGENT=codex
            --env "SAIL_MEMORY_ROOT=$HOME/Library/Application Support/dev.smykla.sai-harness/memory"
            --env "SAIL_SETTINGS_PATH=$HOME/Library/Application Support/sail/settings.json"
            sail-shared-memory -- "$HOME/sideprojects/sai-harness/src-tauri/target/debug/sail" --memory-mcp);
      fi
  # dotfiles/git/config signs every commit with this key, so git can't
  # commit until it's imported. Last: a failing command stops the ones after it.
  - name: git signing key imported
    check: gpg --list-secret-keys C25DFDF396ADF455 > /dev/null 2>&1
    run: >-
      echo "GPG key C25DFDF396ADF455 (signingKey in dotfiles/git/config) is missing; git commits will fail." >&2;
      echo "Export it on the old Mac: gpg --export-secret-keys --armor C25DFDF396ADF455 > key.asc" >&2;
      echo "Import it here: gpg --import key.asc && rm key.asc, then run zakwas apply again." >&2;
      exit 1

defaults:
  - {domain: com.apple.dock, key: autohide, value: true}
  - {domain: com.apple.dock, key: show-recents, value: false}
  - {domain: com.apple.dock, key: wvous-br-corner, value: 1}
  - {domain: com.apple.finder, key: AppleShowAllExtensions, value: true}
  - {domain: com.apple.finder, key: FXEnableExtensionChangeWarning, value: false}
  - {domain: NSGlobalDomain, key: AppleShowAllExtensions, value: true}
  - {domain: NSGlobalDomain, key: InitialKeyRepeat, value: 15}
  - {domain: NSGlobalDomain, key: KeyRepeat, value: 2}
  - {domain: NSGlobalDomain, key: AppleInterfaceStyle, value: Dark}
  - {domain: NSGlobalDomain, key: com.apple.keyboard.fnState, value: true}
  - {domain: com.apple.screencapture, key: location, value: ~/Documents/screenshots}
  - {domain: com.apple.screencapture, key: type, value: png}
